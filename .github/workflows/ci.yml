name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: R2 · sin importaciones atadas al runtime
        run: |
          if grep -rnE "['\"]cloudflare:" src/; then
            echo "R2 incumplida: importacion especifica del runtime en src/"
            exit 1
          fi
          if grep -rn "locals.runtime" src/; then
            echo "R2 incumplida: configuracion leida del contexto del runtime"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - name: R1 · solo claves permitidas en wrangler.json
        run: node scripts/check-r1.mjs
      - run: npm run format:check
      - run: npm run check
      - run: npm run build

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1" # debe coincidir con el rev de .pre-commit-config.yaml
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --exit-code 1
